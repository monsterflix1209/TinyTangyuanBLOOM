<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATCHTVarr｜最終遊戲入口</title><style>body{margin:0;background:linear-gradient(135deg,#d9f2c8,#b9e4ef);font-family:system-ui,"Noto Sans TC",sans-serif;color:#24352b}.wrap{width:min(1100px,96vw);margin:auto;padding:20px}.hero{background:#fffffff0;border-radius:28px;padding:24px;box-shadow:0 15px 50px #0002}.title{font-size:clamp(34px,7vw,64px);font-weight:950;margin:0}.sub{line-height:1.7;color:#58705e}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{border:0;border-radius:15px;padding:13px 18px;font-weight:900;cursor:pointer;background:white}.tab.active{background:#ffd45c}.game{width:100%;height:calc(100vh - 250px);min-height:560px;border:0;border-radius:24px;background:white;box-shadow:0 12px 35px #0002}.note{font-size:13px;color:#627366;margin-top:10px}</style></head><body><div class="wrap"><section class="hero"><div style="font-size:48px">👾🌱🏙️📺</div><h1 class="title">WATCHTVarr</h1><p class="sub">一個入口，兩條冒險線：先在城市探索、收集與成長，再進入完整的五回合故事挑戰。</p><div class="tabs"><button class="tab active" onclick="load('game-v2.html',this)">🏙️ 城市探索</button><button class="tab" onclick="load('index.html',this)">📺 五回合主線</button><button class="tab" onclick="load('game-launch.html',this)">✨ 遊戲介紹</button></div><iframe id="game" class="game" src="game-v2.html" title="WATCHTVarr Game"></iframe><div class="note">💾 城市探索會使用瀏覽器本機保存部分發現資料；所有模式都可直接在瀏覽器遊玩。</div></section></div><script>function load(src,b){document.querySelector('#game').src=src;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}</script></body></html>
