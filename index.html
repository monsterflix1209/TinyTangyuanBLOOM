<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TinyTangyuan BLOOM｜小湯圓・花開日記</title><style>:root{--ink:#314052;--muted:#71808d;--paper:#fffdf8;--blue:#a9dfea;--green:#bfe2c5;--pink:#f5bfd2;--yellow:#f6df9d;--accent:#4f8e9d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf9fb,#fff9ed);color:var(--ink);font-family:ui-rounded,"Noto Sans TC",system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:30px;box-shadow:0 12px 30px #506b7518}h1{margin:0;font-size:20px}.tag,.label{color:var(--muted);font-size:12px}.pills{display:flex;gap:8px}.pill{background:#ffffffc9;border:1px solid white;padding:8px 11px;border-radius:999px}.hero,.panel{background:#ffffffc9;border:1px solid white;border-radius:26px;box-shadow:0 18px 50px #64748b18}.hero{margin-top:14px;padding:22px}.hero h2{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:5px 0 10px;letter-spacing:-2px}.hero p{max-width:650px;color:#62707d;line-height:1.7}.btn{border:0;border-radius:15px;padding:12px 16px;font-weight:800;cursor:pointer;background:#edf5f4;color:#42616a}.primary{background:var(--accent);color:#fff}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:14px;margin-top:14px}.panel{padding:16px}.map{height:465px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(145deg,#d9eee1 0 33%,#f7edca 33% 58%,#d5edf4 58%)}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(30deg,transparent 0 46px,#ffffff55 47px 50px),repeating-linear-gradient(110deg,transparent 0 67px,#ffffff55 68px 71px)}.water{position:absolute;right:-8%;bottom:-9%;width:48%;height:45%;background:#9fdceb99;border-radius:50%}.road{position:absolute;width:120%;height:26px;left:-10%;top:48%;background:#ffffffbb;border-radius:99px;transform:rotate(-20deg);box-shadow:0 4px #c3d0ca}.road.r2{top:25%;transform:rotate(45deg)}.bubble{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:#fff;padding:8px 13px;border-radius:15px;box-shadow:0 8px 22px #536b6a22;z-index:5;white-space:nowrap}.tangyuan{position:absolute;left:50%;top:60%;font-size:68px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 6px #536b6a33);z-index:4;animation:bob 1.8s ease-in-out infinite}.pin{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border:0;border-radius:50%;background:#fff;font-size:24px;box-shadow:0 8px 22px #536b6a33;cursor:pointer;z-index:4}.flower{position:absolute;font-size:22px;z-index:3;animation:pop .35s ease-out}.side{display:flex;flex-direction:column;gap:14px}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#fff;border-radius:17px;padding:13px}.num{font-size:24px;font-weight:900}.diary{line-height:1.8;background:#fffdf4;border-radius:18px;padding:15px;border:1px dashed #dbcfa9}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.actions{margin-top:10px}.tabs{margin-top:14px}.tab{flex:1;min-width:110px}.tab.on{background:#fff;box-shadow:0 12px 25px #52656d14}.content{margin-top:14px;min-height:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.sprout{padding:13px;border-radius:18px;background:linear-gradient(145deg,#fff,#eff8f1)}.sprout .emoji{font-size:32px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#314052;color:#fff;padding:11px 16px;border-radius:999px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}footer{text-align:center;color:#88929c;font-size:12px;padding:22px}@keyframes bob{50%{transform:translate(-50%,-58%) scale(1.04)}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.map{height:390px}.pills{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">⚪</div><div><h1>TinyTangyuan BLOOM</h1><div class="tag">小湯圓・花開日記</div></div></div><div class="pills"><div class="pill">🌸 <b id="flowers">0</b> 花</div><div class="pill">🌱 <b id="sprouts">1</b> 芽</div></div></header><section class="hero"><div class="tag">THIS WORLD IS TOO HARD.</div><h2>走出去一點點，<br>世界就會柔軟一點點。</h2><p>這是一個「陪你生活」的散步遊戲原型。你不用刷任務，只要走一點、發現一點、留下今天的記憶。</p><button class="btn primary" onclick="startWalk()">🚶 和小湯圓一起出發</button></section><div class="layout"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">🗺️ 今日散步地圖</h3><span class="label" id="location">模擬世界</span></div><div class="map" id="map"><div class="water"></div><div class="road"></div><div class="road r2"></div><div class="bubble" id="bubble">「今天要去哪裡？」</div><div class="tangyuan" id="tangyuan">⚪</div><button class="pin" style="left:18%;top:70%" onclick="discover('公園','🌳')">🌳</button><button class="pin" style="left:73%;top:28%" onclick="discover('車站','🚉')">🚉</button><button class="pin" style="left:80%;top:72%" onclick="discover('海邊','🌊')">🌊</button><button class="pin" style="left:37%;top:23%" onclick="discover('小店','🏪')">🏪</button></div><div class="actions"><button class="btn primary" onclick="walkStep()">👣 走一小步</button><button class="btn" onclick="plantFlower()">🌸 種一朵花</button><button class="btn" onclick="geo()">📍 嘗試定位</button></div></section><aside class="side"><section class="panel"><div style="display:flex;justify-content:space-between"><h3 style="margin:0 0 10px">☀️ 今日狀態</h3><span id="mood">🌱 平靜</span></div><div class="stat"><div class="card"><div class="num" id="steps">0</div><div class="label">遊戲步數</div></div><div class="card"><div class="num" id="places">0</div><div class="label">發現地點</div></div><div class="card"><div class="num" id="days">1</div><div class="label">陪伴天數</div></div><div class="card"><div class="num" id="memories">0</div><div class="label">今日記憶</div></div></div></section><section class="panel"><h3 style="margin-top:0">📖 今日小事</h3><div class="diary" id="diary"></div></section></aside></div><nav class="tabs"><button class="btn tab on" onclick="show('home',this)">🏡<br>家</button><button class="btn tab" onclick="show('walk',this)">🗺️<br>散步</button><button class="btn tab" onclick="show('buds',this)">🌱<br>夥伴</button><button class="btn tab" onclick="show('diary',this)">📖<br>日記</button><button class="btn tab" onclick="show('collection',this)">🎒<br>收藏</button></nav><section class="panel content" id="content"></section><footer>Prototype · TinyTangyuan BLOOM · 「今天也一起走了一點點。」</footer></div><div class="toast" id="toast"></div><script>const KEY='tty-bloom-save-v1';const flowerSet=['🌸','🌼','🌷','🌺','🌻','💮'];const buds=[['🌱','草芽','喜歡公園'],['🌸','花芽','喜歡花田'],['💧','水芽','喜歡河邊'],['🍂','秋芽','喜歡森林'],['❄️','雪芽','喜歡冷冷的地方'],['🌙','夜芽','晚上才出現'],['⭐','星芽','非常稀有']];let s=JSON.parse(localStorage.getItem(KEY)||'null')||{steps:0,flowers:0,sprouts:1,places:0,memories:0,days:1,found:[],planted:[]};function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function render(){['steps','flowers','sprouts','places','memories','days'].forEach(id=>document.getElementById(id).textContent=s[id]);document.getElementById('diary').innerHTML=diaryText()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function walkStep(){s.steps+=100;s.memories++;const m=['🌱 平靜','☀️ 開心','🍃 放空','✨ 興奮'];document.getElementById('mood').textContent=m[Math.floor(s.steps/100)%m.length];document.getElementById('bubble').textContent=s.steps%500===0?'「我們又走遠一點了。」':'「一起走吧。」';if(Math.random()<.22){s.sprouts++;toast('🌱 發現新的湯圓芽！')}save()}function startWalk(){walkStep();document.getElementById('tangyuan').animate([{transform:'translate(-50%,-50%)'},{transform:'translate(-20%,-50%)'},{transform:'translate(-50%,-50%)'}],{duration:700});toast('⚪ 小湯圓跟上來了！')}function plantFlower(){s.flowers++;s.memories++;const f=document.createElement('div');f.className='flower';f.textContent=flowerSet[Math.floor(Math.random()*flowerSet.length)];f.style.left=10+Math.random()*80+'%';f.style.top=10+Math.random()*75+'%';document.getElementById('map').appendChild(f);s.planted.push(f.textContent);toast('🌸 世界變柔軟了一點。');save()}function discover(name,icon){if(!s.found.includes(name)){s.found.push(name);s.places++;s.memories++;s.sprouts++;document.getElementById('bubble').textContent=`「${icon} ${name}……記住了。」`;toast(`📍 發現：${name} ＋新的湯圓芽`)}else toast(`⚪「我們又回到${name}了。」`);save()}function diaryText(){const d=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});return `<b>${d}</b><br>今天走了 <b>${s.steps.toLocaleString()}</b> 步。<br>種下了 <b>${s.flowers}</b> 朵花，發現 <b>${s.places}</b> 個地方。<br><br>「今天沒有發生什麼大事。<br>但是，我很喜歡。」`}function show(tab,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');const c=document.getElementById('content');const cards=bud=>bud.map(x=>`<div class="sprout"><div class="emoji">${x[0]}</div><b>${x[1]}</b><div class="label">${x[2]}</div></div>`).join('');if(tab==='home')c.innerHTML='<h3>🏡 小湯圓小屋</h3><div class="grid"><div class="sprout"><div class="emoji">🛋️</div><b>柔軟沙發</b><div class="label">最適合一起發呆。</div></div><div class="sprout"><div class="emoji">📮</div><b>明信片牆</b><div class="label">旅行的記憶住在這裡。</div></div><div class="sprout"><div class="emoji">🪴</div><b>窗邊花盆</b><div class="label">今天也可以再種一朵。</div></div></div>';if(tab==='walk')c.innerHTML='<h3>🗺️ 散步記錄</h3><p>每走一點，小湯圓就多記住一點你的生活。</p><div class="grid"><div class="card"><div class="num">'+s.steps.toLocaleString()+'</div><div class="label">遊戲步數</div></div><div class="card"><div class="num">'+s.flowers+'</div><div class="label">花朵</div></div></div>';if(tab==='buds')c.innerHTML='<h3>🌱 湯圓芽圖鑑</h3><div class="grid">'+cards(buds)+'</div>';if(tab==='diary')c.innerHTML='<h3>📖 我的日記</h3><div class="diary">'+diaryText()+'</div>';if(tab==='collection')c.innerHTML='<h3>🎒 記憶收藏</h3><p>📍 已記住：'+(s.found.join('、')||'還沒有地方')+'</p><p>🌸 種下：'+(s.planted.join(' ')||'還沒有花')+'</p>'}function geo(){if(!navigator.geolocation){toast('📍 此瀏覽器不支援定位');return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById('location').textContent=p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4);toast('📍 小湯圓記住你現在的位置了！')},()=>toast('📍 定位未取得，繼續走也沒關係。'))}render();show('home',document.querySelector('.tab'));</script></body></html>
