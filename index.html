<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATCHTVarr｜小怪獸的偷看電視危機</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1320;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}button{font:inherit;border:0;cursor:pointer}.hidden{display:none!important}.screen{min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(980px,95vw);background:#182238;border:1px solid #3b4b69;border-radius:26px;padding:28px;box-shadow:0 25px 80px #0009}.title{font-size:clamp(34px,6vw,66px);font-weight:950;margin:0 0 8px}.sub{color:#c1cbe0;line-height:1.8}.btn{background:#ffd45a;color:#151922;font-weight:900;padding:13px 20px;border-radius:13px;margin:7px}.btn:disabled{opacity:.35;cursor:not-allowed}.ghost{background:#2a3853;color:#fff}.hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(1100px,94vw);display:grid;grid-template-columns:1fr 1fr 120px 110px;gap:8px;z-index:5}.stat{background:#172136ee;border:1px solid #3c4b68;border-radius:13px;padding:8px 11px;font-size:13px}.bar{height:7px;background:#303b52;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;width:0;transition:.15s}.game{width:min(1100px,94vw);height:min(660px,78vh);min-height:470px;position:relative;background:#d7c29d;border:5px solid #5a3f2d;border-radius:24px;overflow:hidden;box-shadow:0 20px 70px #0009}.wall{position:absolute;inset:0 0 43%;background:linear-gradient(135deg,#eee4d1,#cdbda2)}.floor{position:absolute;inset:auto 0 0;height:43%;background:repeating-linear-gradient(90deg,#a87950 0 55px,#b9875d 55px 110px);border-top:5px solid #795438}.tv{position:absolute;left:6%;top:12%;width:36%;height:42%;display:flex;align-items:center;justify-content:center}.tv img{width:100%;height:100%;object-fit:contain}.camera{position:absolute;right:5%;top:7%;width:100px;text-align:center}.camera img{width:90px}.beam{position:absolute;right:1%;top:17%;width:50%;height:43%;background:linear-gradient(135deg,#fff6,transparent 63%);clip-path:polygon(100% 0,100% 100%,0 63%);pointer-events:none}.monster{position:absolute;width:88px;height:88px;z-index:3}.monster img{width:100%;height:100%}.item{position:absolute;width:48px;height:48px;display:grid;place-items:center;font-size:34px;z-index:2;animation:bob 1.3s infinite alternate}.item.gone{display:none}@keyframes bob{to{transform:translateY(-8px)}}.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#111827ed;border:1px solid #52617d;border-radius:13px;padding:10px 16px;z-index:10;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.keys{text-align:center;color:#aebbd2;margin-top:8px;font-size:13px}.modal{position:fixed;inset:0;background:#050812dd;display:grid;place-items:center;z-index:20;padding:18px}.modal .panel{max-height:92vh;overflow:auto}.round{font-size:13px;color:#91b9ff;font-weight:800}.big{font-size:42px;font-weight:950}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border-radius:12px;background:#293750;color:#fff}.choice:hover{background:#3a4b6b}.choice.correct{outline:3px solid #86e6a0}.choice.wrong{outline:3px solid #ff8998}.confess{width:100%;min-height:210px;resize:vertical;border-radius:15px;border:2px solid #465775;background:#0f1625;color:#fff;padding:15px;font:inherit;line-height:1.7}.meter{height:9px;background:#303b52;border-radius:10px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;width:0;background:#8fe1a0}.score{font-size:62px;font-weight:950}.log{background:#101827;border-radius:15px;padding:15px;text-align:left;line-height:1.7}.stars{font-size:32px;letter-spacing:5px}.small{color:#9ba8bf;font-size:13px}.asset{width:90px;vertical-align:middle}.dialog{position:absolute;left:5%;right:5%;bottom:5%;background:#111827ee;border:2px solid #52617d;border-radius:17px;padding:13px 17px;z-index:8}.dialog b{color:#ffd45a}.objective{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#111827dd;border:1px solid #52617d;padding:7px 13px;border-radius:10px;z-index:6;font-size:13px}
</style></head><body>
<div id="start" class="screen"><div class="panel"><div class="small">WATCHTVarr ORIGINAL · MULTI-ROUND EDITION</div><h1 class="title">📺 小怪獸的偷看電視危機</h1><p class="sub">一場不只是「偷看電視」的互動冒險。你要經歷探索、選擇、抓包、記憶挑戰，最後親手寫下悔過書。</p><div class="log"><b>🎮 5 個回合</b><br>① 客廳探索　② 偷看電視　③ 危機選擇　④ 反省挑戰　⑤ 親手悔過</div><button class="btn" onclick="begin()">開始冒險 ▶</button></div></div>
<div id="wrap" class="hidden"><div class="hud"><div class="stat">👀 危險<div class="bar"><div id="danger" class="fill" style="background:#ff667d"></div></div></div><div class="stat">📺 進度<div class="bar"><div id="progress" class="fill" style="background:#7fd6ff"></div></div></div><div class="stat">⭐ 分數 <b id="score">0</b></div><div class="stat">🎯 回合 <b id="roundNo">1/5</b></div></div><div class="screen"><div id="game" class="game"><div class="wall"></div><div class="floor"></div><div id="objective" class="objective"></div><div class="tv"><img src="assets/tv.svg"></div><div class="beam"></div><div class="camera"><img src="assets/camera.svg"></div><div id="items"></div><div id="monster" class="monster"><img src="assets/monster.svg"></div><div id="dialog" class="dialog hidden"></div><div id="toast" class="toast"></div></div></div><div class="keys">⌨️ WASD / 方向鍵移動　｜　空白鍵互動　｜　手機可用下方觸控鍵</div><div style="text-align:center"><button class="btn ghost" onclick="showHelp()">❔ 遊戲說明</button></div></div>
<div id="modal" class="modal hidden"><div id="modalBox" class="panel"></div></div>
<script>
const $=s=>document.querySelector(s),game=$('#game'),monster=$('#monster');let x=120,y=330,keys={},danger=0,progress=0,score=0,round=0,running=false,phase=0,items=[];const rounds=[
{title:'第一回合｜客廳探索',obj:'找到 3 個小物品，熟悉客廳。',items:['🧸','📕','🧦'],need:3},
{title:'第二回合｜偷偷靠近電視',obj:'靠近電視累積 100% 進度。',items:[],need:100},
{title:'第三回合｜危機時刻',obj:'面對「被爸爸發現」的選擇。',items:[],need:1},
{title:'第四回合｜記憶與反省',obj:'回答 4 個情境題。',items:[],need:4},
{title:'第五回合｜真正的悔過',obj:'親手寫下至少 80 字悔過書。',items:[],need:80}];
function begin(){round=0;score=0;danger=0;progress=0;$('#start').classList.add('hidden');$('#wrap').classList.remove('hidden');startRound()}
function startRound(){phase=0;progress=0;danger=0;$('#roundNo').textContent=(round+1)+'/5';$('#score').textContent=Math.floor(score);$('#objective').textContent=rounds[round].obj;$('#dialog').classList.add('hidden');items=[];$('#items').innerHTML='';if(round===0){rounds[0].items.forEach((v,i)=>{const el=document.createElement('div');el.className='item';el.textContent=v;el.style.left=(48+i*16)+'%';el.style.top=(28+i*17)+'%';el.dataset.got='0';$('#items').append(el);items.push(el)})}x=120;y=350;monster.style.left=x+'px';monster.style.top=y+'px';running=true;toastMsg(rounds[round].title);requestAnimationFrame(loop)}
function toastMsg(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1500)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&running)interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loop(){if(!running)return;const r=game.getBoundingClientRect(),sp=4.7;if(keys.arrowleft||keys.a)x-=sp;if(keys.arrowright||keys.d)x+=sp;if(keys.arrowup||keys.w)y-=sp;if(keys.arrowdown||keys.s)y+=sp;x=Math.max(8,Math.min(r.width-96,x));y=Math.max(58,Math.min(r.height-100,y));monster.style.left=x+'px';monster.style.top=y+'px';if(round===0)collect(r);if(round===1)watch(r);if(round===1){const beam=x>r.width*.47&&y<r.height*.59;if(beam&&!nearTV(r))danger=Math.min(100,danger+.11)}$('#danger').style.width=danger+'%';$('#progress').style.width=progress+'%';$('#score').textContent=Math.floor(score);if(danger>=100){running=false;caught()}else if(round===0&&items.filter(i=>i.dataset.got==='1').length===3){running=false;score+=100;nextRound()}else if(round===1&&progress>=100){running=false;score+=150;nextRound()}else requestAnimationFrame(loop)}
function nearTV(r){return x<r.width*.07+r.width*.36+45&&x+88>r.width*.07-20&&y<r.height*.12+r.height*.42+45&&y+88>r.height*.12-20}
function collect(r){items.forEach(el=>{if(el.dataset.got==='1')return;const ex=parseFloat(el.style.left)/100*r.width,ey=parseFloat(el.style.top)/100*r.height;if(Math.hypot(x-ex,y-ey)<70){el.dataset.got='1';el.classList.add('gone');score+=30;toastMsg('✨ 找到 '+el.textContent)}})}
function watch(r){if(nearTV(r)){progress=Math.min(100,progress+.22);score+=.35;if(Math.random()<.012)toastMsg('📺 偷看中……')};if(Math.random()<.0035)danger=Math.min(100,danger+.5)}
function interact(){if(round===2)showChoice();else if(round===3)showMemory();}
function nextRound(){round++;if(round>=5){finish();return}setTimeout(()=>{if(round===2)showChoice();else if(round===3)showMemory();else if(round===4)showConfession();else startRound()},450)}
function caught(){openModal(`<div style="text-align:center"><img src="assets/caught.svg" style="width:170px"><div class="big">🚨 被爸爸抓包！</div><p>你在第二回合被發現了。這不是結束——你還可以進入危機選擇與悔過階段。</p><button class="btn" onclick="round=2;nextRound()">繼續面對後果</button></div>`)}
function showChoice(){running=false;openModal(`<div class="round">第三回合｜危機時刻</div><h2>🚨 你發現爸爸可能要走進來了。</h2><p>你已經做了錯誤的選擇。現在該怎麼辦？</p><button class="choice" onclick="choice(false,'繼續躲、假裝沒事')">A．繼續躲，假裝什麼都沒發生</button><button class="choice" onclick="choice(true,'承認自己偷看了')">B．直接承認自己偷看了</button><button class="choice" onclick="choice(false,'把事情藏起來')">C．再想辦法把事情藏起來</button>`)}
function choice(ok,text){if(ok){score+=100;openModal(`<div style="text-align:center"><div class="stars">⭐⭐⭐</div><h2>你選擇面對。</h2><p>「我做錯了，我應該承認。」</p><button class="btn" onclick="round=3;nextRound()">進入下一回合 ▶</button></div>`)}else{score=Math.max(0,score-40);openModal(`<div style="text-align:center"><div class="stars">⭐</div><h2>這不是最好的選擇。</h2><p>你選了「${text}」。躲避只會讓信任更難修復。</p><button class="btn" onclick="round=3;nextRound()">重新反省 ▶</button></div>`)}}
const qs=[['明明知道不能看，卻還是看，問題在哪？',['明知規定仍故意違反','電視太好看','爸爸沒提醒'],'明知規定仍故意違反'],['為什麼遮住監視器需要反省？',['因為玩具不好看','因為想讓爸爸看不到自己在做什麼','因為監視器太大'],'因為想讓爸爸看不到自己在做什麼'],['「沒被發現就沒關係」對嗎？',['對','不對'],'不對'],['真正的改過是什麼？',['只說對不起','下次遇到同樣情況做出不同選擇','希望爸爸忘記'],'下次遇到同樣情況做出不同選擇']];let qi=0,qpts=0;
function showMemory(){qi=0;qpts=0;running=false;renderQ()}
function renderQ(){const [q,opts,ans]=qs[qi];openModal(`<div class="round">第四回合｜記憶與反省 · ${qi+1}/4</div><h2>${q}</h2>${opts.map(o=>`<button class="choice" onclick="answer(${JSON.stringify(o)})">${o}</button>`).join('')}`)}
function answer(o){const ans=qs[qi][2];if(o===ans){qpts++;score+=50;toastMsg('✅ 答對了')}else{score=Math.max(0,score-15);toastMsg('❌ 想想真正錯在哪裡')}qi++;if(qi<qs.length)setTimeout(renderQ,300);else setTimeout(()=>{openModal(`<div style="text-align:center"><div class="big">${qpts}/4</div><h2>${qpts===4?'🌟 全部答對！':'💭 反省還可以更深入'}</h2><p>下一回合，你要親手寫下自己的悔過。</p><button class="btn" onclick="round=4;nextRound()">開始悔過 ▶</button></div>`)},400)}
function showConfession(){running=false;openModal(`<div class="round">第五回合｜真正的悔過</div><h2><img class="asset" src="assets/confession.svg"> 親手寫下悔過書</h2><p>不要只寫「對不起」。請寫出：<b>做錯什麼、為什麼錯、爸爸的感受、以後怎麼改。</b></p><textarea id="confess" class="confess" placeholder="爸爸，對不起……我這次明明知道不能看電視，卻還是……"></textarea><div class="meter"><i id="meter"></i></div><div id="count">0 / 80 字</div><button id="submit" class="btn" disabled onclick="submitConfession()">提交悔過書</button>`);$('#confess').addEventListener('input',updateConfess)}
function updateConfess(){const n=$('#confess').value.trim().length;$('#count').textContent=n+' / 80 字';$('#meter').style.width=Math.min(100,n/0.8)+'%';$('#submit').disabled=n<80}
function submitConfession(){const t=$('#confess').value.trim();const words=[['爸爸',15],['對不起',10],['偷看',12],['電視',8],['監視器',15],['小怪獸',8],['知道錯',10],['以後',8],['不再',7],['改',7]];let p=0;words.forEach(([w,v])=>{if(t.includes(w))p+=v});p=Math.min(100,p+Math.min(10,Math.floor(t.length/80)));score+=p;openModal(`<div style="text-align:center"><img class="asset" src="assets/confession.svg"><div class="big">${p} 反省分</div><h2>${p>=80?'🌟 真正的反省！':p>=55?'👍 有進步！':'💭 還可以更具體'}</h2><p>你的悔過書已經送出。接下來會看到完整結算。</p><button class="btn" onclick="finish()">查看最終結果 ▶</button></div>`)}
function finish(){running=false;$('#modal').classList.add('hidden');setTimeout(()=>openModal(`<div style="text-align:center"><div class="round">WATCHTVarr · FINAL REPORT</div><div class="big">🏆 ${Math.floor(score)} 分</div><div class="stars">${score>=450?'⭐⭐⭐⭐⭐':score>=320?'⭐⭐⭐⭐':'⭐⭐⭐'}</div><h2>小怪獸的冒險完成！</h2><div class="log"><b>你經歷了：</b><br>🔎 探索客廳 → 📺 偷看電視 → 🚨 面對後果 → 🧠 反省挑戰 → 📝 親手悔過<br><br><b>真正的重點：</b>不是「怎麼不被抓到」，而是知道做錯後，願意承認、負責，並在下一次做出更好的選擇。</div><button class="btn" onclick="location.reload()">再玩一次 ↻</button></div>`),300)}
function openModal(html){$('#modal').classList.remove('hidden');$('#modalBox').innerHTML=html}function showHelp(){openModal(`<h2>🎮 遊戲說明</h2><p>本遊戲共有 5 個回合，每一回合都有不同玩法。</p><ol><li>探索：收集客廳 3 個物品。</li><li>偷看：靠近電視累積進度，同時注意危險值。</li><li>危機：選擇如何面對錯誤。</li><li>反省：回答 4 題情境題。</li><li>悔過：親手寫至少 80 字，完成真正的反省。</li></ol><button class="btn" onclick="$('#modal').classList.add('hidden')">返回遊戲</button>`)}
</script></body></html>
