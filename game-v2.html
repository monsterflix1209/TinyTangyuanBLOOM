<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATCHTVarr BLOOM CITY</title><style>
*{box-sizing:border-box}body{margin:0;background:#b9dce9;color:#24332a;font-family:system-ui,"Noto Sans TC",sans-serif}.app{width:min(1100px,100%);margin:auto;min-height:100vh;background:#e9f4dc;overflow:hidden}.top{display:flex;gap:8px;padding:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:#ffffffd9;backdrop-filter:blur(8px)}.pill{background:white;border-radius:18px;padding:8px 12px;font-weight:900;box-shadow:0 4px 12px #4562}.pill:first-child{flex:1}.city{height:62vh;min-height:470px;position:relative;overflow:hidden;background:linear-gradient(#bfe4f2 0 30%,#cbe7b5 30%)}.sun{position:absolute;right:8%;top:6%;font-size:60px}.road{position:absolute;background:#e6d5ad;border:5px solid #c3b27f;box-shadow:0 5px 0 #a99263}.r1{width:120%;height:75px;top:48%;left:-10%;transform:rotate(-8deg)}.r2{width:70px;height:110%;left:50%;top:-5%;transform:rotate(12deg)}.building{position:absolute;font-size:64px;filter:drop-shadow(0 8px 4px #0002);z-index:2;cursor:pointer}.park{position:absolute;left:5%;top:8%;width:30%;height:28%;border-radius:30px;background:#a8d98c;border:5px solid #82b86c;z-index:1}.pond{position:absolute;right:5%;top:12%;width:190px;height:115px;border-radius:50%;background:#8ed7e7;border:6px solid #6ebbc9;z-index:1}.player{position:absolute;font-size:62px;z-index:5;transition:.08s;filter:drop-shadow(0 7px 3px #0003)}.pet{position:absolute;font-size:30px;z-index:4;transition:.12s}.thing{position:absolute;font-size:35px;z-index:4;cursor:pointer;animation:bob 1.2s infinite}.npc{position:absolute;font-size:48px;z-index:4;cursor:pointer}.badge{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:16px;padding:8px 12px;font-weight:900;z-index:8}.bottom{padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#f9fff1}.card{background:white;border-radius:18px;padding:10px;text-align:center;box-shadow:0 3px 12px #4452}.num{font-size:24px;font-weight:900}.bar{height:8px;background:#dfe7d8;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#76c66d;width:0}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;background:#e1efd0}.actions button{border:0;border-radius:15px;padding:12px;background:white;font-weight:900;box-shadow:0 4px 10px #5464}.modal{position:fixed;inset:0;background:#18281899;z-index:30;display:grid;place-items:center;padding:20px}.box{width:min(720px,94%);background:#fffef2;border-radius:28px;padding:24px;box-shadow:0 25px 70px #0005}.choices{display:grid;gap:10px}.choices button,button{border:0;border-radius:14px;padding:13px;background:#eaf4dc;font-weight:900;cursor:pointer}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:40;background:#1f2e24;color:white;border-radius:18px;padding:12px 18px;font-weight:900}.night{filter:saturate(.8) brightness(.72)}@keyframes bob{50%{transform:translateY(-7px)}}@media(max-width:700px){.bottom{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:repeat(3,1fr)}.city{min-height:520px}}
</style></head><body><div class="app"><div class="top"><div class="pill">👾 WATCHTVarr CITY</div><div class="pill">📅 Day <span id="day">1</span></div><div class="pill">🕐 <span id="clock">08:00</span></div><div class="pill">💰 <span id="coins">30</span></div><div class="pill">⭐ <span id="score">0</span></div></div><div id="city" class="city"><div class="sun">☀️</div><div class="park"><b style="display:block;text-align:center;margin-top:8px">🌳 中央公園</b></div><div class="pond">💧</div><div class="road r1"></div><div class="road r2"></div><div class="building" data-place="🏪 零食商店" style="left:72%;top:37%">🏪</div><div class="building" data-place="🏠 小怪獸之家" style="left:7%;top:51%">🏠</div><div class="building" data-place="📚 圖書館" style="left:76%;top:67%">📚</div><div class="building" data-place="🎡 歡樂廣場" style="left:30%;top:70%">🎡</div><div id="player" class="player" style="left:46%;top:45%">👾</div><div id="badge" class="badge">🌱 今天還沒有冒險</div></div><div class="actions"><button onclick="mission()">🎯 任務</button><button onclick="shop()">🛍️ 商店</button><button onclick="team()">👾 隊伍</button><button onclick="journal()">📖 圖鑑</button><button onclick="plant()">🌸 種花</button></div><div class="bottom"><div class="card">🚶<div class="num" id="steps">0</div>步數</div><div class="card">🌱<div class="num" id="seeds">3</div>種子</div><div class="card">🌼<div class="num" id="flowers">0</div>花朵</div><div class="card">👾<div class="num" id="count">1</div>隊伍</div><div class="card">❤️<div class="num" id="energy">100</div>體力<div class="bar"><i id="energybar"></i></div></div><div class="card">🔥<div class="num" id="streak">1</div>連續日</div></div><div id="modal" class="modal hidden"><div id="box" class="box"></div></div><div id="toast" class="toast hidden"></div></div><script>
const city=document.querySelector('#city'),p=document.querySelector('#player');let x=46,y=45,steps=0,seeds=3,flowers=0,coins=30,score=0,day=1,energy=100,streak=1,clock=8,keys={};let found=new Set(JSON.parse(localStorage.getItem('wt-found')||'[]'));let tasks={walk:0,find:0,plant:0};
const el=id=>document.getElementById(id);function save(){localStorage.setItem('wt-found',JSON.stringify([...found]))}function toast(t){el('toast').textContent=t;el('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>el('toast').classList.add('hidden'),1800)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function loop(){let mv=false,s=.62;if(keys.arrowleft||keys.a){x-=s;mv=1}if(keys.arrowright||keys.d){x+=s;mv=1}if(keys.arrowup||keys.w){y-=s;mv=1}if(keys.arrowdown||keys.s){y+=s;mv=1}x=Math.max(2,Math.min(94,x));y=Math.max(4,Math.min(88,y));p.style.left=x+'%';p.style.top=y+'%';if(mv&&energy>0){steps++;energy=Math.max(0,energy-.015);tasks.walk++;if(steps%25===0)spawn();if(steps%100===0)advanceTime()}if(energy<=0&&!mv)energy=Math.min(100,energy+.08);document.querySelectorAll('.pet').forEach((q,i)=>{q.style.left=Math.max(2,x-5-i*2)+'%';q.style.top=Math.min(88,y+5+i*1.5)+'%'});update();requestAnimationFrame(loop)}
function update(){el('steps').textContent=steps;el('seeds').textContent=seeds;el('flowers').textContent=flowers;el('count').textContent=Math.min(12,1+Math.floor(flowers/2));el('coins').textContent=coins;el('score').textContent=Math.floor(score);el('energy').textContent=Math.floor(energy);el('energybar').style.width=energy+'%';el('day').textContent=day;el('clock').textContent=String(Math.floor(clock)).padStart(2,'0')+':'+(Math.floor((clock%1)*60)+'').padStart(2,'0');el('streak').textContent=streak}
function advanceTime(){clock+=.5;if(clock>=24){clock=8;day++;streak++;energy=100;tasks={walk:0,find:0,plant:0};score+=100;toast('🌅 新的一天！城市任務更新了！');spawn();spawn()}if(clock>=18){city.classList.add('night')}else city.classList.remove('night')}
function spawn(){let types=['🌱','🌼','🎁','⭐','🍪','📸','🥚'];let v=types[Math.floor(Math.random()*types.length)],q=document.createElement('div');q.className='thing';q.textContent=v;q.style.left=(5+Math.random()*88)+'%';q.style.top=(8+Math.random()*78)+'%';q.onclick=()=>collect(q,v);city.appendChild(q);setTimeout(()=>q.remove(),20000)}
function collect(q,v){q.remove();tasks.find++;let gain={"🌱":1,"🌼":1,"🎁":5,"⭐":15,"🍪":3,"📸":10,"🥚":1}[v];if(v==='🌱')seeds+=gain;else if(v==='🌼')flowers+=gain;else if(v==='🥚'){flowers+=2;toast('🥚 發現神秘蛋！隊伍潛力提升！')}else coins+=gain;score+=gain*4;badge('✨ 發現 '+v+'！');update()}
function badge(t){el('badge').textContent=t;setTimeout(()=>el('badge').textContent='🌱 繼續探索城市！',2500)}
function open(html){el('box').innerHTML=html;el('modal').classList.remove('hidden')}function close(){el('modal').classList.add('hidden')}
function mission(){open(`<h2>🎯 今日城市任務</h2><p>走路：${tasks.walk}/120</p><p>發現物品：${tasks.find}/3</p><p>種花：${tasks.plant}/2</p><div class="choices"><button onclick="claim()">🏆 檢查任務</button><button onclick="close()">繼續探索</button></div>`)}
function claim(){let n=0;if(tasks.walk>=120)n++;if(tasks.find>=3)n++;if(tasks.plant>=2)n++;if(n){coins+=n*20;score+=n*80;toast('🏆 完成 '+n+' 個任務！');close()}else open('<h2>💭 還差一點！</h2><p>再走走、找找東西、種幾朵花吧。</p><button onclick="close()">出發！</button>');update()}
function shop(){open(`<h2>🛍️ 零食商店</h2><p>你有 💰 ${coins} 金幣</p><div class="choices"><button onclick="buy(10)">🍪 買零食（10💰）→ +20 體力</button><button onclick="buy(15)">🌱 買種子（15💰）→ +3 種子</button><button onclick="buy(25)">🥚 神秘蛋（25💰）→ +1 種子、+30 分</button><button onclick="close()">離開商店</button></div>`)}
function buy(price){if(coins<price)return toast('💸 金幣不夠！');coins-=price;if(price===10)energy=Math.min(100,energy+20);else if(price===15)seeds+=3;else{seeds++;score+=30}toast('🛍️ 購買成功！');shop();update()}
function team(){let n=Math.min(12,1+Math.floor(flowers/2));open(`<h2>👾 小怪獸隊伍</h2><p>目前有 ${n} 隻小怪獸跟著你！</p><div style="font-size:38px;letter-spacing:5px">${'👾'.repeat(n)}</div><p>花朵越多，隊伍越壯大。隊伍越大，探索事件越容易出現。</p><button onclick="close()">出發！</button>`)}
function journal(){let list=['🌱 種子','🌼 花朵','🎁 寶箱','⭐ 星星','🍪 零食','📸 城市照片','🥚 神秘蛋'];open(`<h2>📖 發現圖鑑</h2><p>${list.map((v,i)=>found.has(String(i))?'✅ '+v:'❓ 未發現').join('<br>')}</p><p>提示：城市中的驚喜會隨時間出現。</p><button onclick="close()">關閉</button>`)}
function plant(){if(seeds<=0)return toast('🌱 沒有種子了！去城市找找。');seeds--;flowers++;tasks.plant++;score+=12;advanceTime();let f=document.createElement('div');f.className='thing';f.textContent='🌸';f.style.left=x+'%';f.style.top=y+'%';city.appendChild(f);setTimeout(()=>f.remove(),12000);toast('🌸 種下一朵花！');update()}
city.querySelectorAll('.building').forEach(b=>b.onclick=()=>{let name=b.dataset.place;score+=5;coins+=2;open(`<h2>${name}</h2><p>你來到城市的一個新地點。</p><p>這裡今天似乎藏著一個小驚喜……</p><button onclick="close();spawn();spawn()">🔎 探索這裡</button>`);update()});
update();for(let i=0;i<8;i++)setTimeout(spawn,i*400);loop();
</script></body></html>
