<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悔過挑戰</title><style>body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#101522;color:#fff;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.box{width:min(760px,94vw);background:#192237;border:2px solid #405070;border-radius:24px;padding:30px;box-sizing:border-box}h1{font-size:42px;margin:0 0 8px}p{line-height:1.7;color:#c6d0e3}.mistake{background:#252f46;padding:16px;border-radius:14px;line-height:1.8}textarea{width:100%;min-height:240px;box-sizing:border-box;margin-top:14px;border-radius:14px;border:2px solid #465673;background:#101827;color:white;padding:16px;font:18px/1.7 inherit;resize:vertical}.btn{margin-top:14px;padding:13px 20px;border:0;border-radius:12px;background:#ffd45a;font-weight:900;font-size:17px;cursor:pointer}.result{margin-top:20px;padding:18px;border-radius:14px;background:#202c43}.good{color:#9be7a7}.small{color:#9aa8c0}</style></head><body><main class="box"><div class="small">WATCHTVarr｜悔過挑戰</div><h1>📝 真的悔過</h1><p>遊戲失敗不是重點。現在請小怪獸真正想一想：自己到底錯在哪裡？</p><div class="mistake">❌ 明明知道不能看電視，卻偷偷看。<br>❌ 還拿小怪獸遮住監視器。<br>❌ 抱著「不要被發現就沒事」的想法。</div><textarea id="text" placeholder="請寫下你的悔過內容……例如：我明明知道不能看，還是故意去看，而且還遮住監視器。我知道這樣會讓爸爸不信任我，以後我會先問爸爸……"></textarea><button class="btn" onclick="submitRepent()">提交悔過書 ✓</button><div id="result"></div></main><script>function submitRepent(){const t=document.getElementById('text').value.trim(),r=document.getElementById('result');if(t.length<30){r.innerHTML='<p>⚠️ 悔過內容太短了，請至少認真寫 30 個字。</p>';return}let pts=0;['不能','錯','對不起','監視器','爸爸','以後','改','偷偷'].forEach(k=>{if(t.includes(k))pts+=10});pts=Math.min(100,Math.max(40,pts));r.innerHTML=`<div class="result"><div class="good">🎉 悔過書已提交！</div><h2>反省分數：${pts}/100</h2><p>真正的反省不是為了「不被抓到」，而是知道自己做錯後，下一次願意做出不同的選擇。</p><p>你寫下的內容：<br>${t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>')}</p><button class="btn" onclick="location.href='index.html'">回到遊戲 ↩</button></div>`}</script></body></html>
