<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATCHTVarr｜小怪獸的偷看電視危機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#101522;color:#fff;overflow:hidden}button{font:inherit;border:0;cursor:pointer}.hidden{display:none!important}.screen{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(900px,96vw);background:#182033;border:2px solid #33415f;border-radius:28px;padding:34px;box-shadow:0 25px 80px #0008}.title{font-size:clamp(32px,6vw,64px);font-weight:900;margin:0 0 10px}.sub{color:#b9c5dc;font-size:18px;line-height:1.7}.btn{background:#ffd45a;color:#151922;font-weight:900;padding:14px 22px;border-radius:14px;margin-top:14px}.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1000px,94vw);display:flex;gap:12px;z-index:5}.stat{flex:1;background:#182033ee;border:1px solid #405070;border-radius:14px;padding:10px 14px}.bar{height:8px;background:#303b52;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:#ff6b7d;transition:.2s}.game{width:min(1000px,94vw);height:min(650px,82vh);position:relative;background:#d7c29d;border:5px solid #5a3f2d;border-radius:24px;overflow:hidden;box-shadow:0 20px 70px #0009}.wall{position:absolute;inset:0 0 42%;background:linear-gradient(135deg,#e9dfc9,#cdbda2)}.floor{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,#a87950 0 55px,#b9875d 55px 110px);border-top:5px solid #795438}.tv{position:absolute;left:7%;top:15%;width:35%;height:38%;display:flex;align-items:center;justify-content:center}.tv img{width:92%;max-height:100%;object-fit:contain}.camera{position:absolute;right:7%;top:10%;width:105px;text-align:center}.camera img{width:90px}.beam{position:absolute;right:3%;top:20%;width:48%;height:38%;background:linear-gradient(135deg,#fff5,transparent 60%);clip-path:polygon(100% 0,100% 100%,0 65%);pointer-events:none}.monster{position:absolute;width:90px;height:90px;z-index:3;transition:transform .08s}.monster img{width:100%;height:100%;object-fit:contain}.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#151b29ef;border:1px solid #4a5875;border-radius:13px;padding:10px 16px;z-index:10;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.keys{margin-top:10px;color:#aebbd2;text-align:center}.modal{position:fixed;inset:0;background:#050812dd;display:grid;place-items:center;z-index:20;padding:20px}.quiz{max-width:760px;max-height:90vh;overflow:auto}.q{font-size:25px;font-weight:800;margin:16px 0}.choice{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border-radius:13px;background:#27334b;color:#fff}.choice:hover{background:#344463}.score{font-size:56px;font-weight:900}.small{color:#9ba8bf;font-size:14px}.report{max-height:45vh;overflow:auto;text-align:left;line-height:1.7}.report li{margin:8px 0}.confess{width:100%;min-height:190px;resize:vertical;border-radius:16px;border:2px solid #43516d;background:#0f1625;color:#fff;padding:16px;font:inherit;line-height:1.7}.meter{height:10px;background:#303b52;border-radius:10px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;width:0;background:#8fe1a0;transition:.2s}.asset-icon{width:70px;vertical-align:middle;margin-right:10px}
</style>
</head>
<body>
<div id="start" class="screen"><div class="panel"><div class="small">WATCHTVarr ORIGINAL</div><h1 class="title">📺 小怪獸的偷看電視危機</h1><p class="sub">爸爸說現在不能看電視……但小怪獸真的好想看！<br>靠近電視累積進度，最後接受真正的「悔過挑戰」。</p><p>🎨 已加入自製遊戲素材：小怪獸、電視、監視器、抓包警報與悔過書。</p><button class="btn" onclick="startGame()">開始遊戲 ▶</button></div></div>
<div id="gameWrap" class="hidden"><div class="hud"><div class="stat">👀 被發現程度<div class="bar"><div id="danger" class="fill"></div></div></div><div class="stat">📺 看電視進度<div class="bar"><div id="progress" class="fill" style="background:#7fd6ff"></div></div></div><div class="stat">⭐ 分數 <b id="score">0</b></div></div><div class="screen"><div id="game" class="game"><div class="wall"></div><div class="floor"></div><div class="tv"><img src="assets/tv.svg" alt="電視"></div><div class="beam"></div><div class="camera"><img src="assets/camera.svg" alt="監視器"></div><div id="monster" class="monster"><img src="assets/monster.svg" alt="小怪獸"></div><div id="toast" class="toast"></div></div></div><div class="keys">⌨️ 方向鍵 / WASD 移動　｜　靠近電視增加進度　｜　被監視器照到會增加危險</div></div>
<div id="modal" class="modal hidden"><div id="modalBox" class="panel quiz"></div></div>
<script>
const monster=document.querySelector('#monster'),game=document.querySelector('#game'),dangerEl=document.querySelector('#danger'),progressEl=document.querySelector('#progress'),scoreEl=document.querySelector('#score'),toast=document.querySelector('#toast');let x=120,y=360,danger=0,progress=0,score=0,running=false,keys={};
function startGame(){document.querySelector('#start').classList.add('hidden');document.querySelector('#gameWrap').classList.remove('hidden');running=true;requestAnimationFrame(loop);toastMsg('偷偷靠近電視……')}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1400)}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loop(){if(!running)return;const r=game.getBoundingClientRect(),sp=4.5;if(keys.arrowleft||keys.a)x-=sp;if(keys.arrowright||keys.d)x+=sp;if(keys.arrowup||keys.w)y-=sp;if(keys.arrowdown||keys.s)y+=sp;x=Math.max(10,Math.min(r.width-100,x));y=Math.max(60,Math.min(r.height-100,y));monster.style.left=x+'px';monster.style.top=y+'px';const tv={x:r.width*.07,y:r.height*.15,w:r.width*.35,h:r.height*.38};const near=x<tv.x+tv.w+45&&x+90>tv.x-20&&y<tv.y+tv.h+45&&y+90>tv.y-20;if(near){progress=Math.min(100,progress+.18);score+=.3;if(Math.random()<.015)toastMsg('📺 偷看中……快一點！')}const inBeam=x>r.width*.48&&y<r.height*.58;if(inBeam&&!near)danger=Math.min(100,danger+.08);if(near&&Math.random()<.006)danger=Math.min(100,danger+1.2);dangerEl.style.width=danger+'%';progressEl.style.width=progress+'%';scoreEl.textContent=Math.floor(score);monster.style.transform=inBeam?'scale(1.05)':'scale(1)';if(danger>=100){running=false;showCaught()}else if(progress>=100){running=false;showQuiz()}else requestAnimationFrame(loop)}
function openModal(html){document.querySelector('#modal').classList.remove('hidden');document.querySelector('#modalBox').innerHTML=html}
function showCaught(){openModal(`<div style="text-align:center"><img src="assets/caught.svg" style="width:180px"><h2>被爸爸抓包！</h2><p>小怪獸：「完蛋了……我不但偷看電視，還遮了監視器……」</p><p>現在不是想辦法躲，而是要真正反省。</p><button class="btn" onclick="showConfession()">📝 開始悔過</button></div>`)}
function showQuiz(){showConfession()}
function showConfession(){openModal(`<div class="small">悔過挑戰</div><h2><img class="asset-icon" src="assets/confession.svg" alt="悔過書">寫下真正的反省</h2><p>請用自己的話寫：你哪裡做錯？為什麼錯？以後要怎麼改？</p><textarea id="confess" class="confess" placeholder="爸爸，對不起……"></textarea><div class="meter"><i id="meter"></i></div><div id="count">0 字</div><button id="submit" class="btn" disabled onclick="submitConfession()">提交悔過書</button>`);document.querySelector('#confess').addEventListener('input',updateConfess)}
function updateConfess(){const t=document.querySelector('#confess').value.trim(),n=t.length;document.querySelector('#count').textContent=n+' 字';document.querySelector('#meter').style.width=Math.min(100,n/1.5)+'%';document.querySelector('#submit').disabled=n<30}
function submitConfession(){const t=document.querySelector('#confess').value.trim();let pts=0;const rules=[['爸爸',15],['偷看',15],['電視',10],['監視器',15],['小怪獸',10],['對不起',10],['知道錯',10],['以後',10],['改',5]];for(const [w,p] of rules)if(t.includes(w))pts+=p;const len=Math.min(10,Math.floor(t.length/50));pts=Math.min(100,pts+len);openModal(`<div style="text-align:center"><img src="assets/confession.svg" style="width:110px"><div class="score">${pts} 分</div><h2>${pts>=80?'🌟 真的有反省！':pts>=50?'👍 有進步，但還可以更具體':'💭 再想想自己真正錯在哪裡'}</h2><p>真正的悔過不是為了「不被抓到」，而是知道自己做錯後，下一次願意做出不同的選擇。</p><button class="btn" onclick="location.reload()">再玩一次 ↻</button></div>`)}
</script></body></html>
