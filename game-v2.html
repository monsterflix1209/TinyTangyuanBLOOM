<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATCHTVarr Bloom Adventure</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#eef5df;color:#273321}button{border:0;border-radius:16px;padding:12px 18px;font-weight:900;cursor:pointer;background:#fff;box-shadow:0 5px 16px #60705233}.app{width:min(1050px,100%);margin:auto;min-height:100vh;background:linear-gradient(#c9e8b6 0 22%,#e9f1d5 22%);position:relative;overflow:hidden}.top{padding:16px;display:flex;justify-content:space-between;gap:8px;position:relative;z-index:5}.pill{background:#ffffffe8;border-radius:18px;padding:8px 12px;font-weight:900}.map{height:58vh;min-height:430px;position:relative;background:#d9edc3;overflow:hidden}.path{position:absolute;width:110%;height:70px;background:#e9d7a6;transform:rotate(-12deg);top:48%;left:-5%;border:5px solid #c5b37d}.grass{position:absolute;inset:0;background-image:radial-gradient(#8dbd6a 1px,transparent 1px);background-size:28px 28px;opacity:.5}.pond{position:absolute;width:180px;height:110px;border-radius:50%;background:#91d8e8;right:8%;top:18%;border:6px solid #75bac8}.tree{position:absolute;font-size:58px;filter:drop-shadow(0 7px 4px #0002)}.house{position:absolute;left:8%;top:18%;font-size:70px}.player{position:absolute;font-size:64px;z-index:3;transition:left .12s,top .12s}.seed{position:absolute;font-size:34px;z-index:2;cursor:pointer;animation:bob 1.3s infinite}.flower{position:absolute;font-size:40px;animation:bob 1.8s infinite}.enemy{position:absolute;font-size:48px;z-index:2;cursor:pointer}.npc{position:absolute;font-size:50px;cursor:pointer}.menu{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#fff9}.card{background:#fff;border-radius:20px;padding:13px;text-align:center;box-shadow:0 4px 18px #53633b20}.big{font-size:26px;font-weight:900}.bar{height:10px;background:#dce4d1;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#7fc66c;width:0}.modal{position:absolute;inset:0;background:#23331b99;z-index:20;display:grid;place-items:center;padding:20px}.box{background:#fffef4;border-radius:28px;padding:28px;width:min(700px,94%);box-shadow:0 20px 60px #0004}.choices{display:grid;gap:10px}.choices button{text-align:left}.hidden{display:none!important}.walk{font-size:13px;opacity:.7;text-align:center;padding:8px}@keyframes bob{50%{transform:translateY(-7px)}}
</style></head><body><div class="app"><div class="top"><div class="pill">👾 WATCHTVarr BLOOM</div><div class="pill">🚶 今日步數 <span id="steps">0</span></div><div class="pill">🌱 小怪獸 <span id="count">1</span></div></div><div id="map" class="map"><div class="grass"></div><div class="path"></div><div class="pond">💧</div><div class="house">🏠</div><div class="tree" style="left:58%;top:8%">🌳</div><div class="tree" style="left:78%;top:55%">🌲</div><div class="tree" style="left:42%;top:65%">🌳</div><div id="player" class="player" style="left:45%;top:43%">👾</div></div><div class="walk">移動方式：方向鍵 / WASD　｜　走得越多，地圖上的事件越多</div><div class="menu"><div class="card">🌱<div class="big" id="buds">3</div>種子</div><div class="card">🌼<div class="big" id="flowers">0</div>花朵</div><div class="card">⭐<div class="big" id="score">0</div>冒險分</div><div class="card">📅<div class="big" id="day">Day 1</div>旅程</div></div><div id="modal" class="modal hidden"><div id="box" class="box"></div></div></div><script>
const map=document.querySelector('#map'),p=document.querySelector('#player');let x=45,y=43,steps=0,buds=3,flowers=0,score=0,day=1,keys={};const events=[];
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function tick(){let moved=false;if(keys.arrowleft||keys.a){x-=.7;moved=1}if(keys.arrowright||keys.d){x+=.7;moved=1}if(keys.arrowup||keys.w){y-=.7;moved=1}if(keys.arrowdown||keys.s){y+=.7;moved=1}x=Math.max(2,Math.min(94,x));y=Math.max(3,Math.min(88,y));p.style.left=x+'%';p.style.top=y+'%';if(moved){steps++;if(steps%18===0)spawn();if(steps%120===0)newDay()}requestAnimationFrame(tick)}
function spawn(){const types=['seed','flower','enemy','npc'];const t=types[Math.floor(Math.random()*types.length)],el=document.createElement('div');el.className=t;el.style.left=(8+Math.random()*82)+'%';el.style.top=(10+Math.random()*76)+'%';el.textContent=t==='seed'?'🌱':t==='flower'?'🌼':t==='enemy'?'👹':'🧑‍🌾';el.onclick=()=>interact(t,el);map.appendChild(el);events.push(el);setTimeout(()=>{if(el.parentNode)el.remove()},16000)}
function interact(t,el){el.remove();if(t==='seed'){buds++;score+=10;msg('🌱 找到種子！可以培育新的小怪獸。')}else if(t==='flower'){flowers++;score+=15;msg('🌼 收到一朵花！')}else if(t==='enemy'){score+=20;msg('👹 小怪獸把搗蛋鬼趕走了！')}else{score+=5;msg('🧑‍🌾 路人送你一個小任務！')}update()}
function newDay(){day++;score+=30;msg('🌅 新的一天！地圖出現更多事件。');for(let i=0;i<4;i++)setTimeout(spawn,i*300)}
function update(){stepsEl.textContent=steps;document.querySelector('#steps').textContent=steps;document.querySelector('#buds').textContent=buds;document.querySelector('#flowers').textContent=flowers;document.querySelector('#score').textContent=score;document.querySelector('#count').textContent=Math.min(20,1+Math.floor(flowers/3)) ;document.querySelector('#day').textContent='Day '+day}
function msg(text){document.querySelector('#box').innerHTML='<h2>'+text+'</h2><p>繼續探索地圖，還有新的事件會出現。</p><button onclick="closeModal()">繼續冒險</button>';document.querySelector('#modal').classList.remove('hidden')}
function closeModal(){document.querySelector('#modal').classList.add('hidden')}
const stepsEl=document.querySelector('#steps');update();tick();for(let i=0;i<5;i++)setTimeout(spawn,i*500);
</script></body></html>
