<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATCHTVarr｜小怪獸的偷看電視危機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#101522;color:#fff;overflow:hidden}button{font:inherit;border:0;cursor:pointer}.screen{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(900px,96vw);background:#182033;border:2px solid #33415f;border-radius:28px;padding:34px;box-shadow:0 25px 80px #0008}.title{font-size:clamp(32px,6vw,64px);font-weight:900;margin:0 0 10px}.sub{color:#b9c5dc;font-size:18px}.btn{background:#ffd45a;color:#151922;font-weight:900;padding:14px 22px;border-radius:14px;margin-top:20px}.btn:hover{transform:translateY(-2px)}.hidden{display:none!important}.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1000px,94vw);display:flex;gap:12px;z-index:5}.stat{flex:1;background:#182033dd;border:1px solid #405070;border-radius:14px;padding:10px 14px}.bar{height:8px;background:#303b52;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:#ff6b7d;transition:.2s}.game{width:min(1000px,94vw);height:min(650px,82vh);position:relative;background:#d7c29d;border:5px solid #5a3f2d;border-radius:24px;overflow:hidden;box-shadow:0 20px 70px #0009}.wall{position:absolute;inset:0 0 42%;background:linear-gradient(135deg,#e9dfc9,#cdbda2)}.floor{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,#a87950 0 55px,#b9875d 55px 110px);border-top:5px solid #795438}.tv{position:absolute;left:7%;top:17%;width:35%;height:34%;background:#1b202b;border:12px solid #292d38;border-radius:15px;box-shadow:0 15px 25px #0005}.tv:after{content:'📺';position:absolute;inset:0;display:grid;place-items:center;font-size:75px}.stand{position:absolute;left:19%;top:51%;width:12%;height:15%;background:#563b2c}.camera{position:absolute;right:8%;top:12%;width:90px;height:58px;background:#2a3140;border-radius:16px;border:4px solid #111827;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 15px #0005}.beam{position:absolute;right:4%;top:20%;width:45%;height:35%;background:linear-gradient(135deg,#ffffff22,transparent 60%);clip-path:polygon(100% 0,100% 100%,0 65%);pointer-events:none}.monster{position:absolute;width:78px;height:78px;border-radius:42% 58% 50% 50%;background:#9ee493;border:5px solid #47784d;display:grid;place-items:center;font-size:42px;user-select:none;z-index:3;transition:transform .08s}.monster:before,.monster:after{content:'';position:absolute;width:13px;height:13px;background:#fff;border:3px solid #47784d;border-radius:50%;top:13px}.monster:before{left:13px}.monster:after{right:13px}.tvglow{position:absolute;left:4%;top:12%;width:42%;height:43%;background:#8fd3ff18;border-radius:50%}.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#151b29eF;border:1px solid #4a5875;border-radius:13px;padding:10px 16px;z-index:10;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:#050812cc;display:grid;place-items:center;z-index:20;padding:20px}.quiz{max-width:720px}.q{font-size:25px;font-weight:800}.choice{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border-radius:13px;background:#27334b;color:#fff}.choice:hover{background:#344463}.good{color:#91e7a2}.bad{color:#ff9ca7}.score{font-size:56px;font-weight:900}.small{color:#9ba8bf;font-size:14px}.keys{margin-top:10px;color:#aebbd2}.report{max-height:60vh;overflow:auto;text-align:left;line-height:1.7}.report li{margin:8px 0}
</style>
</head>
<body>
<div id="start" class="screen"><div class="panel"><div class="small">WATCHTVarr ORIGINAL</div><h1 class="title">📺 小怪獸的偷看電視危機</h1><p class="sub">爸爸說現在不能看電視……但小怪獸真的好想看！<br>在不被發現的情況下完成任務，最後接受「悔過挑戰」。</p><p>⚠️ 注意：遊戲中的「遮監視器」只是虛構遊戲機制，不代表現實中應該這樣做。</p><button class="btn" onclick="startGame()">開始遊戲 ▶</button></div></div>
<div id="gameWrap" class="hidden">
<div class="hud"><div class="stat">👀 被發現程度 <div class="bar"><div id="danger" class="fill"></div></div></div><div class="stat">📺 看電視進度 <div class="bar"><div id="progress" class="fill" style="background:#7fd6ff"></div></div></div><div class="stat">⭐ 分數 <b id="score">0</b></div></div>
<div class="screen"><div id="game" class="game"><div class="wall"></div><div class="floor"></div><div class="tvglow"></div><div class="tv"></div><div class="stand"></div><div class="beam"></div><div id="camera" class="camera">📹</div><div id="monster" class="monster">👾</div><div id="toast" class="toast"></div></div></div>
<div class="keys">⌨️ 方向鍵 / WASD 移動　｜　靠近電視增加進度　｜　被監視器照到會增加危險</div></div>
<div id="modal" class="modal hidden"><div id="modalBox" class="panel quiz"></div></div>
<script>
const monster=document.querySelector('#monster'),game=document.querySelector('#game'),dangerEl=document.querySelector('#danger'),progressEl=document.querySelector('#progress'),scoreEl=document.querySelector('#score'),toast=document.querySelector('#toast');
let x=120,y=360,danger=0,progress=0,score=0,running=false,keys={};
function startGame(){document.querySelector('#start').classList.add('hidden');document.querySelector('#gameWrap').classList.remove('hidden');running=true;requestAnimationFrame(loop);toastMsg('偷偷靠近電視……');}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1400)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function loop(){if(!running)return;const r=game.getBoundingClientRect();let sp=4.5;if(keys.arrowleft||keys.a)x-=sp;if(keys.arrowright||keys.d)x+=sp;if(keys.arrowup||keys.w)y-=sp;if(keys.arrowdown||keys.s)y+=sp;x=Math.max(10,Math.min(r.width-88,x));y=Math.max(60,Math.min(r.height-95,y));monster.style.left=x+'px';monster.style.top=y+'px';
const tv={x:r.width*.07,y:r.height*.17,w:r.width*.35,h:r.height*.34};const near=x<tv.x+tv.w+45&&x+78>tv.x-20&&y<tv.y+tv.h+45&&y+78>tv.y-20;if(near){progress=Math.min(100,progress+.18);score+=.3;if(Math.random()<.015)toastMsg('📺 偷看中……快一點！')}
const cam={x:r.width*.82,y:r.height*.12,w:90,h:58};const inBeam=x>r.width*.48&&y<r.height*.58; if(inBeam&&!near){danger=Math.min(100,danger+.08)} if(near&&Math.random()<.006)danger=Math.min(100,danger+1.2);dangerEl.style.width=danger+'%';progressEl.style.width=progress+'%';scoreEl.textContent=Math.floor(score);monster.style.transform=inBeam?'scale(1.04)':'scale(1)';
if(danger>=100){running=false;showCaught()}else if(progress>=100){running=false;showQuiz()}else requestAnimationFrame(loop)}
function showCaught(){openModal(`<h2>🚨 被爸爸抓包！</h2><p>小怪獸：「完蛋了……我不但偷看電視，還遮了監視器……」</p><p class="bad">任務失敗，但還有機會靠「真正的反省」挽救分數。</p><button class="btn" onclick="showQuiz()">接受悔過挑戰</button>`)}
const qs=[['明明知道不能看電視，還是去看，最主要的問題是？',['忘記電視在哪裡','明知規定卻故意違反','電視太好看','爸爸沒有提醒'],'明知規定卻故意違反'],['拿小怪獸遮住監視器代表什麼？',['只是玩玩具','想讓爸爸看不到自己在做什麼','幫監視器清潔','整理房間'],'想讓爸爸看不到自己在做什麼'],['「只要沒被發現就沒關係」這個想法對嗎？',['對','不對'],'不對'],['真正的反省比較重要的是？',['一直說對不起','寫很多字','知道錯在哪裡並用行動改變','希望爸爸忘記'],'知道錯在哪裡並用行動改變'],['下一次很想看電視，最好的做法是？',['偷偷看','遮住監視器','先問爸爸並遵守規定','假裝沒看'],'先問爸爸並遵守規定']];let qi=0,qscore=0;
function showQuiz(){qi=0;qscore=0;openModal('');renderQ()}
function renderQ(){if(qi>=qs.length)return showReport();const [q,opts,ans]=qs[qi];document.querySelector('#modalBox').innerHTML=`<div class="small">悔過挑戰 ${qi+1}/${qs.length}</div><div class="q">${q}</div>${opts.map(o=>`<button class="choice" onclick="answer(${JSON.stringify(o)})">${o}</button>`).join('')}`}
function answer(o){const ans=qs[qi][2];if(o===ans){qscore++;toastMsg('✅ 這題反省到了！')}else toastMsg('❌ 再想想真正錯在哪裡');qi++;setTimeout(renderQ,350)}
function showReport(){const final=Math.round(score)+qscore*20;document.querySelector('#modalBox').innerHTML=`<div class="small">反省結果</div><div class="score">${final} 分</div><h2>${qscore===5?'🌟 真正的反省王！':'💭 還可以再進步'}</h2><div class="report"><p>這次遊戲真正要記住的不是「不要被抓到」，而是：</p><ul><li>明明知道不能做，還是故意做，是需要反省的地方。</li><li>做錯後再想辦法躲避，會讓事情更嚴重。</li><li>沒有被發現，不代表事情就是對的。</li><li>信任要靠平常的行動慢慢建立。</li><li>真正的改過，是下一次遇到同樣情況時做出不一樣的選擇。</li></ul></div><button class="btn" onclick="location.reload()">再玩一次 ↻</button>`}
function openModal(html){document.querySelector('#modal').classList.remove('hidden');if(html)document.querySelector('#modalBox').innerHTML=html}
</script>
</body></html>
